# Local CPU deployment (kind). For a cloud GPU, layer values-gpu.yaml on top.

image:
  repository: tinyserve
  tag: dev
  pullPolicy: IfNotPresent # kind loads the image straight into the node; never pull

replicas: 1 # the starting point; the HPA takes over when enabled

model: HuggingFaceTB/SmolLM2-360M-Instruct # small and ungated: tolerable on CPU, no token needed
device: cpu
extraArgs:
  - --kv-cache-gb=0.25 # ~3,200 tokens of fp32 KV cache for this model
  - --max-model-len=2048
  # Cap concurrent sequences so that extra load queues (waiting_requests > 0)
  # instead of slowing every stream. The queue is the HPA's scaling signal.
  - --max-batch-size=8

# The HuggingFace cache. Locally it's the host's cache, mounted into the kind
# node, so new pods start without downloading the model.
hfCache:
  hostPath: /hf-cache # path on the node; null = an emptyDir (each pod downloads)

# Only needed for gated models (e.g. meta-llama/*): a Secret with key HF_TOKEN.
hfTokenSecret: null

# Measured: one pod under load uses ~2.7 GB (fp32 weights 1.45 GB + KV cache
# + PyTorch). bf16 would halve that, but PyTorch's CPU bf16 path ran 4x slower.
resources:
  requests:
    cpu: "2"
    memory: 2560Mi
  limits:
    memory: 3584Mi

service:
  type: NodePort
  port: 8000
  nodePort: 30080 # kind maps this to localhost:8080

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2 # two ~2.7 GB pods + Prometheus fit an 8 GB Docker VM; a third wouldn't
  # Add replicas when the average pod has more than this many requests queued.
  targetWaitingRequests: 2
